name: Håll Supabase vaket

# Gratisprojekt pausas efter en veckas inaktivitet. Ett enkelt anrop tre gånger i veckan räcker.
on:
  schedule:
    - cron: '17 6 * * 1,3,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Anropa Supabase REST
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            "${{ vars.VITE_SUPABASE_URL }}/rest/v1/apartments?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
